server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/tmp/mysql-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&fallbackToSystemTrustStore=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
app.seed=false
app.bootstrap.username=${ADMIN_USERNAME:admin}
app.bootstrap.password=${ADMIN_PASSWORD:}
